[project]
name = "cvat-sam2-agents"
version = "0.1.0"
description = "Shared dependencies for SAM2 tracker and interactor CVAT agents"
readme = "README.md"
authors = [
    { name = "CVAT.ai", email = "support@cvat.ai" }
]
requires-python = ">=3.10"
dependencies = [
    "cvat-sdk>=2.42",
    "cvat-cli",
    "huggingface-hub>=1.1.4",
    "opencv-python-headless>=4.12.0.88",
    "sam-2",
]

[tool.uv.sources]
sam-2 = { git = "https://github.com/facebookresearch/sam2.git", rev = "2b90b9f5ceec907a1c18123530e92e794ad901a4" }
cvat-cli = { path = "../../../cvat-cli" }
cvat-sdk = { path = "../../../cvat-sdk" }
