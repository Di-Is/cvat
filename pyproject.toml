    "rules>=3.3",
    "Shapely==1.7.1",
    "tqdm>=4.58.0",
    "xmlsec>=1.3.14,<2",
]

[tool.uv]
environments = ["python_version == '3.10'"]

[tool.uv.sources]
datumaro = { git = "https://github.com/cvat-ai/datumaro.git", rev = "866f27c70970467b169c81de33678d3bf8dcfca8" }
