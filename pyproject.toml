[tool.isort]
profile = "black"
forced_separate = ["tests"]
line_length = 100
skip_gitignore = true # align tool behavior with Black
extend_skip=[
    # Correctly ordering the imports in serverless functions would
    # require a pyproject.toml in every function; don't bother with it for now.
    "serverless",
]

[tool.black]
line-length = 100
target-version = ['py39']
extend-exclude = """
# TODO: get rid of these
^/cvat/apps/(
    dataset_manager/bindings.py
    |engine/(
        mixins.py
        |models.py
        |permissions.py
        |serializers.py
        |task.py
        |views.py
    )
)
| ^/serverless/
"""

[dependency-groups]
dev = [
    "bandit==1.8.6",
    "black==25.*",
    "django-extensions==3.0.8",
    "django-silk==5.*",
    "isort==6.*",
    "pytest>=9.0.0",
    "pylint==3.3.7",
    "pylint-django==2.6.1",
    "pylint-plugin-utils==0.8.2",
    "rope==0.17.0",
    "snakeviz==2.1.0",
    "typos==1.33.1",
]
test = [
    "coverage==7.2.3",
    "fakeredis[lua]~=2.10",
]

[project]
name = "cvat-workspace"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "attrs==21.4.0",
    "av==15.1.0",
    "azure-storage-blob==12.13.0",
    "boto3~=1.37",
    "clickhouse-connect==0.6.8",
    "datumaro",
    "dj-pagination==2.5.0",
    "dj-rest-auth[with_social]==5.0.2",
    "django-allauth[saml]==0.57.2",
    "django-auth-ldap==2.2.0",
    "django-cors-headers==3.5.0",
    "django-crum==0.7.9",
    "django-filter==2.4.0",
    "django-health-check>=3.18.1,<4",
    "django-rq==2.8.1",
    "django-sendfile2==0.7.0",
    "Django~=4.2.7",
    "djangorestframework>=3.15.2,<4",
    "djangorestframework-api-key~=3.1",
    "drf-spectacular==0.26.2",
    "google-cloud-storage~=3.0",
    "json-stream>=2.0,<3",
    "lxml>=5.2.1,<6",
    "natsort==8.0.0",
    "numpy~=1.22.2",
    "opencv-python-headless~=4.8",
    "patool==1.12",
    "pdf2image==1.14.0",
    "Pillow>=10.3.0",
    "pottery~=3.0",
    "psutil==5.9.4",
